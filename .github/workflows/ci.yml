name: CI — Sistema Basílico (ECOT11A · UNIFEI)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Typecheck, Vitest (CT01–CT14) & Production Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Executar suíte de testes automatizados (CT01 a CT14 + Cobertura)
        run: npm test

      - name: Compilar TypeScript, Bundle Web (Vite) e Desktop (Electron)
        run: npm run build
